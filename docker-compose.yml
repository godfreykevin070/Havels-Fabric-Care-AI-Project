version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fabric
      POSTGRES_PASSWORD: fabric
      POSTGRES_DB: fabriccare
    ports:
      - "5432:5432"
    volumes:
      - fabriccare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://fabric:fabric@db:5432/fabriccare
      CORS_ORIGINS: '["http://localhost:5173"]'
      MODEL_DIR: /app/artifacts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - fabriccare_models:/app/artifacts

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE: /api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  fabriccare_pgdata:
  fabriccare_models: